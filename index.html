├<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Bike Shop | Mercado Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --primary-color: #2ea44f;
            --primary-hover: #2c974b;
            --accent-color: #f9826c;
            --text-color: #c9d1d9;
            --text-light: #f0f6fc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-light);
        }

        .logo span { color: var(--primary-color); }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            font-size: 22px;
            color: var(--text-light);
        }

        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: var(--accent-color);
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 50%;
            font-weight: bold;
        }

        .container {
            display: flex;
            padding: 30px 5%;
            gap: 30px;
            flex-grow: 1;
        }

        main { flex: 3; }

        .catalog-title {
            font-size: 28px;
            margin-bottom: 20px;
            color: var(--text-light);
            border-bottom: 2px solid #30363d;
            padding-bottom: 10px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .product-card {
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #21262d;
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-brand {
            font-size: 12px;
            text-transform: uppercase;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-title {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        .product-link {
            font-size: 13px;
            color: #58a6ff;
            text-decoration: none;
            margin-bottom: 15px;
            display: inline-block;
        }

        .product-link:hover { text-decoration: underline; }

        .product-price {
            font-size: 22px;
            font-weight: bold;
            color: var(--text-light);
            margin-top: auto;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn-add:hover { background-color: var(--primary-hover); }

        /* Lateral do Carrinho */
        sidebar {
            flex: 1;
            background-color: var(--panel-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 90px;
        }

        .sidebar-title {
            font-size: 20px;
            color: var(--text-light);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .cart-items {
            max-height: 350px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #30363d;
            font-size: 14px;
        }

        .cart-item-details { flex-grow: 1; padding-right: 10px; }
        .cart-item-title { color: var(--text-light); font-weight: 500; }
        .cart-item-qty { font-size: 12px; color: #8b949e; }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-remove {
            background: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
        }

        .cart-total {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-light);
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #30363d;
        }

        .btn-checkout {
            background-color: #21262d;
            color: var(--text-light);
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-checkout:hover { background-color: #30363d; }

        footer {
            background-color: var(--panel-bg);
            text-align: center;
            padding: 20px;
            border-top: 1px solid #30363d;
            margin-top: auto;
            font-size: 14px;
        }

        @media (max-width: 900px) {
            .container { flex-direction: column; }
            sidebar { position: static; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fas fa-bicycle"></i> APEX <span>BIKE SHOP</span></div>
        <div class="cart-icon-container">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-count" id="nav-cart-count">0</span>
        </div>
    </header>

    <div class="container">
        <main>
            <h2 class="catalog-title">Bicicletas e Quadros Premium</h2>
            <div class="products-grid" id="bikes-grid">
                </div>

            <h2 class="catalog-title" style="margin-top: 40px;">Sistemas de Freio Recomendados</h2>
            <div class="products-grid" id="brakes-grid">
                </div>
        </main>

        <sidebar>
            <h3 class="sidebar-title">Seu Carrinho <i class="fas fa-shopping-bag"></i></h3>
            <div class="cart-items" id="cart-items-container">
                <p style="text-align: center; color: #8b949e; padding: 20px 0;">O carrinho está vazio.</p>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-value">R$ 0,00</span>
            </div>
            <button class="btn-checkout" onclick="checkout()">Finalizar Pedido</button>
        </sidebar>
    </div>

    <footer>
        <p>&copy; 2026 Apex Bike Shop - Mercado Digital de Alta Performance. Hospedado no GitHub Pages.</p>
    </footer>

    <script>
        // Banco de Dados dos Produtos do Mercado
        const produtos = [
            { id: 1, categoria: "bike", marca: "Gios BR", titulo: "Quadro Gios FRX EVO", preco: 980.00, link: "https://www.giosbr.com.br", img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?q=80&w=500" },
            { id: 2, categoria: "bike", marca: "Hupi", titulo: "Quadro Hupi Naja V4 Dirt", preco: 1250.00, link: "https://www.hupishop.com.br", img: "https://images.unsplash.com/photo-1532298229144-0ec0c57515c7?q=80&w=500" },
            { id: 3, categoria: "bike", marca: "Santa Cruz", titulo: "Santa Cruz Nomad Carbon CC", preco: 45900.00, link: "https://www.santacruzbicycles.com", img: "https://images.unsplash.com/photo-1576435465679-644737ebdf22?q=80&w=500" },
            { id: 4, categoria: "freio", marca: "Magura", titulo: "Kit Freio Hidráulico Magura MT7 Pro", preco: 3200.00, link: "https://www.magura.com", img: "https://images.unsplash.com/photo-1507136566006-cfc505b114fc?q=80&w=500" },
            { id: 5, categoria: "freio", marca: "Shimano", titulo: "Freio a Disco Shimano Deore XT M8120", preco: 1890.00, link: "https://bike.shimano.com", img: "https://images.unsplash.com/photo-1605335198443-4e4b78c87fca?q=80&w=500" },
            { id: 6, categoria: "freio", marca: "Magura", titulo: "Par de Freios Magura MT8 Carbon", preco: 4100.00, link: "https://www.magura.com", img: "https://images.unsplash.com/photo-1511994298241-608e28f14f66?q=80&w=500" }
        ];

        // Estado do Carrinho de Compras
        let carrinho = [];

        // Inicializar e Renderizar as vitrines
        function renderCatalogo() {
            const bikesGrid = document.getElementById("bikes-grid");
            const brakesGrid = document.getElementById("brakes-grid");
            
            bikesGrid.innerHTML = "";
            brakesGrid.innerHTML = "";

            produtos.forEach(prod => {
                const card = document.createElement("div");
                card.className = "product-card";
                card.innerHTML = `
                    <img src="${prod.img}" alt="${prod.titulo}" class="product-img">
                    <div class="product-info">
                        <span class="product-brand">${prod.marca}</span>
                        <h3 class="product-title">${prod.titulo}</h3>
                        <a href="${prod.link}" target="_blank" class="product-link">Visitar site do fabricante <i class="fas fa-external-link-alt"></i></a>
                        <div class="product-price">R$ ${prod.preco.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
                        <button class="btn-add" onclick="adicionarAoCarrinho(${prod.id})">Adicionar ao Carrinho</button>
                    </div>
                `;

                if(prod.categoria === "bike") {
                    bikesGrid.appendChild(card);
                } else {
                    brakesGrid.appendChild(card);
                }
            });
        }

        // Adicionar item (permite quantos produtos quiser, incrementando quantidade)
        function adicionarAoCarrinho(id) {
            const produto = produtos.find(p => p.id === id);
            const itemNoCarrinho = carrinho.find(item => item.id === id);

            if (itemNoCarrinho) {
                itemNoCarrinho.quantidade++;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }

            atualizarInterfaceCarrinho();
        }

        // Remover item do carrinho
        function removerDoCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarInterfaceCarrinho();
        }

        // Atualizar contadores e valores
        function atualizarInterfaceCarrinho() {
            const cartContainer = document.getElementById("cart-items-container");
            const totalValueEl = document.getElementById("cart-total-value");
            const navCartCount = document.getElementById("nav-cart-count");

            if (carrinho.length === 0) {
                cartContainer.innerHTML = `<p style="text-align: center; color: #8b949e; padding: 20px 0;">O carrinho está vazio.</p>`;
                totalValueEl.textContent = "R$ 0,00";
                navCartCount.textContent = "0";
                return;
            }

            cartContainer.innerHTML = "";
            let valorTotal = 0;
            let totalItens = 0;

            carrinho.forEach(item => {
                valorTotal += (item.preco * item.quantidade);
                totalItens += item.quantidade;

                const itemRow = document.createElement("div");
                itemRow.className = "cart-item";
                itemRow.innerHTML = `
                    <div class="cart-item-details">
                        <div class="cart-item-title">${item.titulo}</div>
                        <div class="cart-item-qty">${item.quantidade}x - R$ ${(item.preco * item.quantidade).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
                    </div>
                    <div class="cart-item-actions">
                        <button class="btn-remove" onclick="removerDoCarrinho(${item.id})"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                cartContainer.appendChild(itemRow);
            });

            totalValueEl.textContent = `R$ ${valorTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            navCartCount.textContent = totalItens;
        }

        // Finalizar Pedido
        function checkout() {
            if(carrinho.length === 0) {
                alert("Seu carrinho está vazio!");
                return;
            }
            alert("Pedido simulado com sucesso! Sistema integrado pronto para checkout.");
            carrinho = [];
            atualizarInterfaceCarrinho();
        }

        // Iniciar página
        renderCatalogo();
    </script>
</body>
</html>
